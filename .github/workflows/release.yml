name: Release Pickosaurus

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pickosaurus-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: vars.PICKOSAURUS_RELEASES_ENABLED == 'true'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install build tools on the hosted runner
        run: brew install xcodegen create-dmg

      - name: Run checks before loading signing credentials
        run: |
          python3 scripts/check-publication.py
          scripts/test.sh

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          TASK_KEYCHAIN="$RUNNER_TEMP/pickosaurus-build.keychain-db"
          TASK_CERT="$RUNNER_TEMP/pickosaurus-developer-id.p12"
          trap 'rm -f "$TASK_CERT"' EXIT
          printf '%s' "$CERT_BASE64" | base64 --decode > "$TASK_CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$TASK_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$TASK_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$TASK_KEYCHAIN"
          security import "$TASK_CERT" -P "$CERT_PASSWORD" -t cert -f pkcs12 \
            -k "$TASK_KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$TASK_KEYCHAIN"
          security list-keychains -d user -s "$TASK_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"

      - name: Build, sign, notarize and package
        id: release
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PICKOSAURUS_UPDATE_REPOSITORY: ${{ github.repository }}
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Attach artifacts to this repository's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TASK_ZIP: ${{ steps.release.outputs.zip_path }}
          TASK_DMG: ${{ steps.release.outputs.dmg_path }}
        run: gh release upload "$GITHUB_REF_NAME" "$TASK_ZIP" "$TASK_DMG"

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/pickosaurus-build.keychain-db" || true
          rm -f "$RUNNER_TEMP/pickosaurus-developer-id.p12"
